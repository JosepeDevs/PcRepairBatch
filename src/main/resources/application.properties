spring.application.name: PERSONBATCH
server.port: ${SERVER_PORT:8088}

spring.batch.job.enabled=false
spring.batch.execution.enabled=false

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/testdb
spring.datasource.username=test_user
spring.datasource.password=test_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.banner.location: banner.txt

## required for a table used by batch:
spring.batch.initialize-schema=always

###### Eureka ######

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://${EUREKA_INSTANCE_HOSTNAME:localhost}:${EUREKA_PORT:9876}/eureka

###### Configurable app options ######

batch.export.output-directory=output
batch.export.output-file=persons.json
batch.export.delimiter=;
batch.export.include-headers=true
batch.export.chunk-size=500
batch.export.export-format=json
batch.export.cron=0 0/5 * * * *
